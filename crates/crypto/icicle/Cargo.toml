[package]
name = "reth-icicle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Optional Icicle GPU acceleration helpers for reth"

[lints]
workspace = true

[dependencies]
reth-config.workspace = true
reth-trie-common.workspace = true
revm-database.workspace = true
alloy-primitives.workspace = true
tracing.workspace = true
thiserror.workspace = true

# Optional Icicle dependencies (GPU backend loaded at runtime)
icicle-runtime = { git = "https://github.com/ingonyama-zk/icicle.git", package = "icicle-runtime", optional = true }
icicle-hash = { git = "https://github.com/ingonyama-zk/icicle.git", package = "icicle-hash", optional = true }
icicle-core = { git = "https://github.com/ingonyama-zk/icicle.git", package = "icicle-core", optional = true }

[features]
default = []
icicle = ["dep:icicle-runtime", "dep:icicle-hash", "dep:icicle-core"]
