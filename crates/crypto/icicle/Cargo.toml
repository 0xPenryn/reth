[package]
name = "reth-icicle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Optional Icicle GPU acceleration helpers for reth"

[lints]
workspace = true

[dependencies]
reth-config.workspace = true
reth-trie-common.workspace = true
revm-database.workspace = true
alloy-primitives.workspace = true
tracing.workspace = true
thiserror.workspace = true

# Optional Icicle dependencies (GPU backend loaded at runtime)
icicle-runtime = { git = "https://github.com/ingonyama-zk/icicle.git", package = "icicle-runtime", optional = true, tag = "v4.0.0" }
icicle-hash = { git = "https://github.com/ingonyama-zk/icicle.git", package = "icicle-hash", optional = true, tag = "v4.0.0" }
icicle-core = { git = "https://github.com/ingonyama-zk/icicle.git", package = "icicle-core", optional = true, tag = "v4.0.0" }
icicle-bn254 = { git = "https://github.com/ingonyama-zk/icicle.git", package = "icicle-bn254", optional = true, tag = "v4.0.0" }
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"], optional = true }
ark-ec = { version = "0.5", default-features = false, optional = true }
ark-ff = { version = "0.5", default-features = false, features = ["asm"], optional = true }
ark-serialize = { version = "0.5", default-features = false, optional = true }

[features]
default = []
icicle = [
    "dep:icicle-runtime",
    "dep:icicle-hash",
    "dep:icicle-core",
    "dep:icicle-bn254",
    "dep:ark-bn254",
    "dep:ark-ec",
    "dep:ark-ff",
    "dep:ark-serialize",
]
